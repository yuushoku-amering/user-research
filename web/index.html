<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岚苔 Vesper · 用户研究工作台</title>
<link rel="stylesheet" href="/web/style.css">
<script>
/* 主题：在**样式表生效前**就把 data-theme 落下去，免得深色用户先看到一道白闪。
   优先级：本地存过的选择 > 系统设置。③ 处（app.js）负责切换与保存。 */
(function(){
  var t = null;
  try { t = localStorage.getItem('urw.theme'); } catch (e) { /* 无痕模式：跳过 */ }
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  // 没存过选择时，跟着系统走（系统切了颜色，页面跟着切）
  try {
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
      var saved = null;
      try { saved = localStorage.getItem('urw.theme'); } catch (err) {}
      if (saved === 'light' || saved === 'dark') return;   // 人自己选过就别动它
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    });
  } catch (e) { /* 老浏览器不支持 addEventListener 形式就算了 */ }
})();
</script>
</head>
<body>

<header class="topbar">
  <!-- 名字（2026-09-27 作者定的）：岚苔 Vesper。
       顶栏窄的时候会截断成「岚苔 Ve…」，悬停能看到全名 —— 所以 title 必须有。 -->
  <div class="brand" title="岚苔 Vesper —— 用户研究工作台"><span class="fish">🐟</span> 岚苔 Vesper</div>

  <div class="proj">
    <label>项目</label>
    <select id="projSel"></select>
    <button class="ghost" id="btnNewProj" title="在 projects/ 下新建一个研究项目">＋ 新建</button>
    <button class="ghost" id="btnOpenProj" title="打开任意已存在的目录">打开…</button>
    <button class="ghost" id="btnSaveProj" title="把整个项目存成一个文件，放到你指定的文件夹">💾 保存</button>
    <button class="ghost" id="btnImportProj" title="选一个项目快照文件，还原现场">导入…</button>
    <button class="ghost danger2" id="btnDelProj" title="删除当前选中的项目（不可恢复，会让你把项目名打一遍）">🗑 删除</button>
    <input type="file" id="fileImport" accept=".urwproj,.zip" style="display:none">
  </div>

  <div class="env" id="env"></div>

  <!-- 设置：SPSS 路径 / 模型 API。都是可选功能，不配也能跑完整个流程
       ⚠ 图标别再画成"中心圆 + 放射线" —— 那就是太阳，会和左边的 🌙/☀️ 撞。
         这里用**八根辐条 + 中心圆孔**拼一个齿形（纯 path，不依赖 transform 属性）。 -->
  <button class="themebtn" id="btnSettings" title="设置：SPSS 路径、模型 API（都是可选的）" aria-label="设置">
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
      <path d="M18.44 8.36 A8.6 8.6 0 0 1 18.44 11.64 L16.28 11.22 A6.4 6.4 0 0 1 15.31 13.58 L17.13 14.81 A8.6 8.6 0 0 1 14.81 17.13 L13.58 15.31 A6.4 6.4 0 0 1 11.22 16.28 L11.64 18.44 A8.6 8.6 0 0 1 8.36 18.44 L8.78 16.28 A6.4 6.4 0 0 1 6.42 15.31 L5.19 17.13 A8.6 8.6 0 0 1 2.87 14.81 L4.69 13.58 A6.4 6.4 0 0 1 3.72 11.22 L1.56 11.64 A8.6 8.6 0 0 1 1.56 8.36 L3.72 8.78 A6.4 6.4 0 0 1 4.69 6.42 L2.87 5.19 A8.6 8.6 0 0 1 5.19 2.87 L6.42 4.69 A6.4 6.4 0 0 1 8.78 3.72 L8.36 1.56 A8.6 8.6 0 0 1 11.64 1.56 L11.22 3.72 A6.4 6.4 0 0 1 13.58 4.69 L14.81 2.87 A8.6 8.6 0 0 1 17.13 5.19 L15.31 6.42 A6.4 6.4 0 0 1 16.28 8.78 Z"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="10" cy="10" r="2.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </svg>
  </button>

  <!-- 主题开关：首次进来跟随系统，点一下就固定成人自己的选择 -->
  <button class="themebtn" id="btnTheme" title="切换浅色 / 深色（默认跟随系统）" aria-label="切换深浅色">
    <svg class="i-moon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
      <path d="M16.5 12.4A6.8 6.8 0 0 1 7.6 3.5a6.9 6.9 0 1 0 8.9 8.9Z"
            fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="i-sun" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
      <circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10 2v1.6M10 16.4V18M18 10h-1.6M3.6 10H2M15.7 4.3l-1.1 1.1M5.4 14.6l-1.1 1.1M15.7 15.7l-1.1-1.1M5.4 5.4 4.3 4.3"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<div class="layout">
  <aside class="rail">
    <div class="rail-title">流程</div>
    <nav id="railList"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <main class="stage" id="stage"></main>
</div>

<footer class="statusbar">
  <span id="statusText">就绪</span>
  <span class="grow"></span>
  <span id="statusJob"></span>
</footer>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<aside class="drawer" id="drawer">
  <div class="drawer-box" id="drawerBox"></div>
</aside>

<script src="/web/app.js"></script>
</body>
</html>
